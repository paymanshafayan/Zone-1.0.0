name: Zone CI/CD

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'
  MOBILE_APP_DIR: apps/mobile

jobs:
  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify mobile app directory exists
        run: |
          if [ ! -d "${{ env.MOBILE_APP_DIR }}" ]; then
            echo "Directory '${{ env.MOBILE_APP_DIR }}' not found"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: flutter pub get

      - name: Analyze project
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: flutter analyze
